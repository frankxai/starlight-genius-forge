name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The failure mode that actually bites a docs repo is a relative link
      # pointing at a file that no longer exists. That is checkable. A "build"
      # here would be theatre, so there isn't one.
      - name: Relative markdown links resolve
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
            if (e.name === '.git' || e.name === 'node_modules') return [];
            const p = path.join(d, e.name);
            return e.isDirectory() ? walk(p) : [p];
          });
          const md = walk('.').filter(f => f.endsWith('.md'));
          if (md.length === 0) { console.error('no markdown found to check'); process.exit(1); }
          const broken = [];
          for (const f of md) {
            const src = fs.readFileSync(f, 'utf8');
            for (const m of src.matchAll(/\[[^\]]*\]\(([^)\s]+)\)/g)) {
              const target = m[1];
              if (/^(https?:|mailto:|#|<)/.test(target)) continue;
              const clean = decodeURIComponent(target.split('#')[0]);
              if (!clean) continue;
              const abs = clean.startsWith('/') ? path.join('.', clean) : path.join(path.dirname(f), clean);
              if (!fs.existsSync(abs)) broken.push(`${f} -> ${target}`);
            }
          }
          console.log(`checked ${md.length} markdown files`);
          if (broken.length) { console.error('\nbroken relative links:\n' + broken.join('\n')); process.exit(1); }
          NODE

  capture-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAPTURE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated browser verifier
        run: |
          export CAPTURE_BROWSER_ROOT="$RUNNER_TEMP/capture-browser"
          printf 'CAPTURE_BROWSER_ROOT=%s\n' "$CAPTURE_BROWSER_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$CAPTURE_BROWSER_ROOT"
          printf '{"private":true}\n' > "$CAPTURE_BROWSER_ROOT/package.json"
          npm install --prefix "$CAPTURE_BROWSER_ROOT" --no-save --no-package-lock playwright@1.64.0
          node "$CAPTURE_BROWSER_ROOT/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Verify actual capture downloads and reopening
        run: node scripts/test_capture_browser.mjs
      - name: Retain source-bound verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: capture-browser-report.json
          if-no-files-found: error
          retention-days: 14
